name: LinkUp web check

on:
  push:
    branches: [feature/linkup-web-pwa-next]
    paths:
      - 'apps/web/**'
      - 'firebase.json'
      - '.github/workflows/web-check.yml'
  pull_request:
    paths:
      - 'apps/web/**'
      - 'firebase.json'
      - '.github/workflows/web-check.yml'

jobs:
  build-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Verify public web artifacts
        working-directory: .
        run: |
          test -f apps/web/dist/index.html
          test -f apps/web/dist/manifest.webmanifest
          test -f apps/web/dist/sw.js
          test -f apps/web/dist/robots.txt
          test -f apps/web/dist/sitemap.xml
